name: CI

# macOS runner makan banyak minit pada repo peribadi, jadi hanya jalan bila
# tag keluaran ditolak, pull request, atau dicetus tangan.
on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Bina
        run: swift build -c release
      - name: Ujian pembersih
        run: .build/release/Sapu --selftest
      - name: Ujian ciri teras
        run: .build/release/Sapu --selftest-core
      - name: Semak versi sepadan dengan tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          V=$(grep -o '"[0-9][0-9.]*"' Sources/Sapu/Version.swift | head -1 | tr -d '"')
          [ "v$V" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} tak sama dengan versi $V"; exit 1; }
